@if (visivel()) {
  <div
    class="abertura" [class.abertura-saindo]="saindo()" [class.abertura-reduzida]="reduzida()"
    [style.--ritmo]="ritmo" [style.--percurso]="percurso()" role="status" aria-label="Abrindo o NeuroVita" (click)="encerrar()"
  >
    <!-- Cápsulas coloridas: cada uma é uma linha grossa que desce reta, curva e entra atrás do cérebro -->
    <svg class="abertura-capsulas" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path class="cap cap-corre cap-azul" [attr.d]="caminhoEsquerda()" />
      <path class="cap cap-corre cap-ponta cap-verde" [attr.d]="caminhoEsquerda()" />
      <path class="cap cap-corre cap-roxo" [attr.d]="caminhoDireita()" />
      <path class="cap cap-corre cap-ponta cap-coral" [attr.d]="caminhoDireita()" />
    </svg>

    <!-- Cérebro e nome (medidas proporcionais à largura da cena) -->
    <div class="abertura-palco">
      <img class="abertura-cerebro" src="img/logo.png" alt="" />
      <span class="abertura-nome">NeuroVita</span>
    </div>

    <button #pular type="button" class="abertura-pular" (click)="encerrar(); $event.stopPropagation()">Pular</button>
  </div>
}
