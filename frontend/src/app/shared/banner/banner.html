<section class="banner" [class.banner-azul]="variante() === 'azul'" [class.banner-roxo]="variante() === 'roxo'">
  <svg class="banner-nuvem" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="30" cy="48" r="22" />
    <circle cx="58" cy="54" r="26" />
    <circle cx="84" cy="70" r="18" />
    <rect x="0" y="62" width="100" height="38" />
  </svg>

  <div class="banner-texto">
    <h2 class="banner-titulo">{{ titulo() }}</h2>
    @if (texto()) {
      <p class="banner-sub">{{ texto() }}</p>
    }
  </div>

  <svg class="banner-ilustracao" viewBox="0 0 200 120" aria-hidden="true">
    <!-- cartão com lista de tarefas -->
    <rect x="2" y="40" width="62" height="64" rx="7" fill="#fff" opacity="0.9" />
    <rect x="10" y="52" width="8" height="8" rx="2" fill="none" stroke="#7a82e6" stroke-width="1.5" />
    <rect x="23" y="54" width="32" height="4" rx="2" fill="#b9bff0" />
    <rect x="10" y="70" width="8" height="8" rx="2" fill="none" stroke="#7a82e6" stroke-width="1.5" />
    <rect x="23" y="72" width="26" height="4" rx="2" fill="#b9bff0" />
    <rect x="10" y="88" width="8" height="8" rx="2" fill="none" stroke="#7a82e6" stroke-width="1.5" />
    <rect x="23" y="90" width="30" height="4" rx="2" fill="#b9bff0" />
    <!-- gráfico de pizza -->
    <circle cx="82" cy="78" r="26" fill="#fff" />
    <circle cx="82" cy="78" r="19" fill="#c9cdf6" />
    <path d="M82 78V59a19 19 0 0 1 18 13z" fill="#7a82e6" />
    <path d="M82 78 66 89a19 19 0 0 1-3-11z" fill="#9aa1ee" />
    <!-- cartão principal -->
    <rect x="112" y="8" width="84" height="104" rx="9" fill="#fff" />
    <rect x="112" y="8" width="84" height="104" rx="9" fill="none" stroke="#d9dcf5" />
    <rect x="124" y="22" width="32" height="5" rx="2.5" fill="#b9bff0" />
    <rect x="124" y="34" width="42" height="5" rx="2.5" fill="#b9bff0" />
    <circle cx="176" cy="34" r="12" fill="#c9cdf6" />
    <circle cx="176" cy="31" r="4.5" fill="#7a82e6" />
    <path d="M167 42a9 7 0 0 1 18 0z" fill="#7a82e6" />
    <rect x="124" y="56" width="62" height="28" rx="5" fill="#eef0fd" />
    <circle cx="134" cy="65" r="3.5" fill="#7a82e6" />
    <rect x="142" y="63" width="34" height="4" rx="2" fill="#b9bff0" />
    <path d="m131 93 4 3 5-6" fill="none" stroke="#7a82e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</section>
