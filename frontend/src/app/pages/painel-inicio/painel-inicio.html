<div>
  <app-cabecalho [config]="config()" />

  @if (config().layout === 'gestao') {
    <app-cards-resumo [cards]="cards()" />
    <div class="acoes">
      @for (acao of config().acoes; track acao.texto) {
        @if (acao.rota) {
          <a class="acao" [routerLink]="acao.rota"><span class="acao-icone"><app-icone [nome]="acao.icone" /></span>{{ acao.texto }}</a>
        }
      }
    </div>
  } @else {
    <app-banner [variante]="config().banner.variante" [titulo]="config().banner.titulo" [texto]="config().banner.texto" />
  }

  @if (carregando()) {
    <p class="agenda-tabela-vazio" role="status">Carregando a agenda do dia…</p>
  } @else if (erroCarga()) {
    <div class="agenda-tabela-vazio" role="alert"><p>Parte dos dados da agenda não pôde ser carregada.</p><button type="button" class="botao-contorno" (click)="recarregar()">Tentar novamente</button></div>
  } @else {
    <app-agenda-do-dia-tabela [linhas]="agendaClinica()" />
  }
</div>
