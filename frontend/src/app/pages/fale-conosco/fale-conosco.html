<div class="pg">
  <app-titulo-pagina titulo="Fale conosco" subtitulo="Ainda com dúvidas? Nossa equipe está pronta para ajudar!" [voltarPara]="raiz() + '/ajuda'" />
  <section class="cartao fale-cartao" aria-labelledby="fale-titulo">
    <app-imagem-ajuda class="fale-figura" src="img/ajuda/atendente.png" alt="Atendimento NeuroVita" [ocultarSeFalhar]="true" />
    <h2 id="fale-titulo" class="fale-titulo">Envie sua mensagem</h2>
    <form class="fale-form" (submit)="enviar($event)">
      <label class="campo-form"><span class="campo-rotulo">Nome completo *</span>
        <input name="nome" autocomplete="name" maxlength="120" required placeholder="Digite seu nome" [value]="nome()" (input)="nome.set($any($event.target).value)" />
      </label>
      <label class="campo-form"><span class="campo-rotulo">E-mail</span>
        <input name="email" type="email" autocomplete="email" maxlength="254" placeholder="Digite seu e-mail" [value]="email()" (input)="email.set($any($event.target).value)" />
      </label>
      <label class="campo-form"><span class="campo-rotulo">Mensagem *</span>
        <textarea name="mensagem" maxlength="5000" required placeholder="Digite sua mensagem..." [value]="mensagem()" (input)="mensagem.set($any($event.target).value)"></textarea>
      </label>
      <p class="fale-nota" role="note">O envio depende do canal institucional de contato configurado para o sistema. A mensagem não é armazenada no prontuário.</p>
      @if (erro()) { <p class="campo-msg" role="alert">{{ erro() }}</p> }
      @if (enviado()) { <p class="campo-msg campo-msg-sucesso" role="status">Mensagem enviada com sucesso.</p> }
      <button class="botao-escuro fale-enviar" type="submit" [disabled]="enviando()"><app-icone nome="enviar" />{{ enviando() ? 'Enviando…' : 'Enviar mensagem' }}</button>
    </form>
  </section>
</div>
