<div class="pg">
  <app-titulo-pagina titulo="Fale conosco" subtitulo="Ainda com dúvidas? Nossa equipe está pronta para ajudar!" [voltarPara]="raiz() + '/ajuda'" />

  <form class="cartao fale-cartao" novalidate (submit)="enviar($event)">
    <app-imagem-ajuda class="fale-figura" src="img/ajuda/atendente.png" alt="Atendente do NeuroVita" [ocultarSeFalhar]="true" />
    <h2 class="fale-titulo">Envie sua mensagem</h2>

    <label class="campo-form" [class.campo-form-erro]="mostrarErro('nome')">
      <span class="campo-rotulo">Nome completo *</span>
      <input type="text" placeholder="Digite seu nome" autocomplete="name" [value]="f().nome" (input)="digitar('nome', $event)" />
      @if (mostrarErro('nome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
    </label>

    <label class="campo-form" [class.campo-form-erro]="mostrarErro('email')">
      <span class="campo-rotulo">E-mail</span>
      <input type="email" placeholder="Digite seu e-mail" autocomplete="email" [value]="f().email" (input)="digitar('email', $event)" />
      @if (mostrarErro('email'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
    </label>

    <label class="campo-form" [class.campo-form-erro]="mostrarErro('mensagem')">
      <span class="campo-rotulo">Mensagem</span>
      <textarea rows="4" placeholder="Digite sua mensagem..." [value]="f().mensagem" (input)="digitar('mensagem', $event)"></textarea>
      @if (mostrarErro('mensagem'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
    </label>

    @if (erro()) { <p class="campo-msg" role="alert">{{ erro() }}</p> }
    @if (enviado()) { <p role="status">Mensagem enviada.</p> }
    <button type="submit" class="botao-escuro ajuda-botao fale-enviar" [disabled]="enviando()">
      <app-icone nome="aviao" /> {{ enviando() ? 'Enviando...' : 'Enviar mensagem' }}
    </button>
  </form>
</div>
