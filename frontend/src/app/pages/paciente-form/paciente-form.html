@if (edicao() && !existente()) {
  <div class="pg">
    <app-titulo-pagina titulo="Paciente não encontrado" subtitulo="Esse paciente não existe ou foi removido." [voltarPara]="voltar()" />
  </div>
} @else {
  <div class="pg">
    <app-titulo-pagina
      [titulo]="edicao() ? 'Editar Paciente' : 'Cadastrar Novo Paciente'"
      subtitulo="Preencha as informações para realizar o cadastro do paciente"
      [voltarPara]="voltar()"
    />

    <form class="cartao form-pac" novalidate (submit)="$event.preventDefault(); cadastrar()">
      <div class="form-pac-grade">
        <!-- Dados pessoais -->
        <section class="form-pac-bloco" aria-labelledby="t-dados">
          <h2 id="t-dados" class="form-pac-titulo"><app-icone nome="usuario" /> Dados Pessoais</h2>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('nome')">
            <span class="campo-rotulo">Nome completo *</span>
            <input type="text" placeholder="Digite o nome completo" autocomplete="off" [value]="f().nome" (input)="digitar('nome', $event)" [attr.aria-invalid]="!!mostrarErro('nome')" />
            @if (mostrarErro('nome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('nascimento')">
              <span class="campo-rotulo">Data de Nascimento*</span>
              <span class="campo-caixa">
                <input type="date" [max]="hoje" [value]="f().nascimento" (input)="digitar('nascimento', $event)" [class.campo-vazio]="!f().nascimento" />
                @if (!f().nascimento) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
              @if (mostrarErro('nascimento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cpf')">
              <span class="campo-rotulo">CPF*</span>
              <input type="text" inputmode="numeric" placeholder="Digite o CPF" autocomplete="off" [value]="f().cpf" (input)="digitar('cpf', $event)" />
              @if (mostrarErro('cpf'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cep')">
              <span class="campo-rotulo">CEP*</span>
              <input type="text" inputmode="numeric" placeholder="Digite o CEP" autocomplete="off" [value]="f().cep" (input)="digitar('cep', $event)" />
              @if (mostrarErro('cep'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form">
              <span class="campo-rotulo">Cidade</span>
              <input type="text" placeholder="Brasília" autocomplete="off" [value]="f().cidade" (input)="digitar('cidade', $event)" />
            </label>
          </div>
          <div class="form-pac-endereco">
            <label class="campo-form">
              <span class="campo-rotulo">Endereço</span>
              <input type="text" placeholder="Digite o endereço" autocomplete="off" [value]="f().endereco" (input)="digitar('endereco', $event)" />
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('numero')">
              <span class="campo-rotulo">Número*</span>
              <input type="text" inputmode="numeric" placeholder="Nº" autocomplete="off" [value]="f().numero" (input)="digitar('numero', $event)" />
              @if (mostrarErro('numero'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-complemento">
            <label class="campo-form">
              <span class="campo-rotulo">Complemento</span>
              <input type="text" placeholder="Digite o complemento" autocomplete="off" [value]="f().complemento" (input)="digitar('complemento', $event)" />
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('bairro')">
              <span class="campo-rotulo">Bairro*</span>
              <input type="text" placeholder="Digite o bairro" autocomplete="off" [value]="f().bairro" (input)="digitar('bairro', $event)" />
              @if (mostrarErro('bairro'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-duas">
            <label class="campo-form">
              <span class="campo-rotulo">Data de início</span>
              <span class="campo-caixa">
                <input type="date" [value]="f().inicio" (input)="digitar('inicio', $event)" [class.campo-vazio]="!f().inicio" />
                @if (!f().inicio) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('encerramento')">
              <span class="campo-rotulo">Data de encerramento</span>
              <span class="campo-caixa">
                <input type="date" [value]="f().encerramento" (input)="digitar('encerramento', $event)" [class.campo-vazio]="!f().encerramento" />
                @if (!f().encerramento) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
              @if (mostrarErro('encerramento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
        </section>

        <!-- Responsável -->
        <section class="form-pac-bloco" aria-labelledby="t-resp">
          <h2 id="t-resp" class="form-pac-titulo">
            <app-icone nome="usuario" /> Responsável
            @if (menorDeIdade()) { <small class="form-pac-aviso">obrigatório para menores de 18 anos</small> }
          </h2>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('rNome')">
            <span class="campo-rotulo">Nome completo*</span>
            <input type="text" placeholder="Digite o nome completo" autocomplete="off" [value]="f().rNome" (input)="digitar('rNome', $event)" />
            @if (mostrarErro('rNome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('rCpf')">
              <span class="campo-rotulo">CPF*</span>
              <input type="text" inputmode="numeric" placeholder="Digite o CPF" autocomplete="off" [value]="f().rCpf" (input)="digitar('rCpf', $event)" />
              @if (mostrarErro('rCpf'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('rTelefone')">
              <span class="campo-rotulo">Telefone*</span>
              <input type="tel" inputmode="tel" placeholder="(00) 00000-0000" autocomplete="off" [value]="f().rTelefone" (input)="digitar('rTelefone', $event)" />
              @if (mostrarErro('rTelefone'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('rEmail')">
            <span class="campo-rotulo">E-mail</span>
            <input type="email" placeholder="Digite o email" autocomplete="off" [value]="f().rEmail" (input)="digitar('rEmail', $event)" />
            @if (mostrarErro('rEmail'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form">
            <span class="campo-rotulo">Endereço</span>
            <input type="text" placeholder="Digite o endereço completo" autocomplete="off" [value]="f().rEndereco" (input)="digitar('rEndereco', $event)" />
          </label>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('rParentesco')">
              <span class="campo-rotulo">Grau de parentesco</span>
              <input type="text" placeholder="Mãe" autocomplete="off" [value]="f().rParentesco" (input)="digitar('rParentesco', $event)" />
              @if (mostrarErro('rParentesco'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <fieldset class="radios radios-status">
            <legend>Status</legend>
            <span class="status-caixa">
              <label class="radio"><input type="radio" name="status" [checked]="f().ativo" (change)="definir('ativo', true)" /><span class="radio-bolinha"></span> Ativo</label>
              <label class="radio"><input type="radio" name="status" [checked]="!f().ativo" (change)="definir('ativo', false)" /><span class="radio-bolinha"></span> Inativo</label>
            </span>
          </fieldset>
        </section>
      </div>

      <div class="form-pac-botoes">
        <button type="button" class="botao-claro" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="botao-escuro">{{ edicao() ? 'Salvar' : 'Cadastrar' }}</button>
      </div>
    </form>
  </div>

  <app-dialogo
    [aberto]="confirmando()" [titulo]="edicao() ? 'Salvar alterações?' : 'Confirmar Cadastro?'"
    (cancelar)="confirmando.set(false)" (confirmar)="confirmar()"
  />
}
