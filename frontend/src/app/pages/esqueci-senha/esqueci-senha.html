<app-auth-card>
  <h1 class="auth-titulo esqueci-titulo">Esqueci minha senha</h1>
  <p class="auth-texto">Para recuperar o acesso, digite o seu e-mail cadastrado.</p>

  <form class="esqueci-form" (submit)="enviar($event)">
    <div class="field">
      <svg class="icon icon-lg text-brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
        <rect x="2" y="4" width="20" height="16" rx="2" />
      </svg>
      <input type="email" required placeholder="E-mail" class="field-input" />
    </div>

    <button type="submit" class="btn-action btn-action-full">
      <svg class="icon icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
        <path d="m21.854 2.147-10.94 10.939" />
      </svg>
      Enviar código de recuperação
    </button>
  </form>

  <a routerLink="/" class="back-link">
    <svg class="icon h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 19-7-7 7-7" />
      <path d="M19 12H5" />
    </svg>
    Voltar para o login
  </a>
</app-auth-card>
