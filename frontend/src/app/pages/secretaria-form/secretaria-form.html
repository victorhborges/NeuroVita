@if (edicao() && !existente()) {
  <div class="pg">
    <app-titulo-pagina titulo="Secretária não encontrada" subtitulo="Esse cadastro não existe ou foi removido." [voltarPara]="voltar()" />
  </div>
} @else {
  <div class="pg">
    <app-titulo-pagina
      [titulo]="edicao() ? 'Editar Secretária' : 'Cadastrar Nova Secretária'"
      [subtitulo]="edicao() ? 'Altere as informações necessárias e salve o cadastro' : 'Preencha as informações para realizar o cadastro da secretária'"
      [voltarPara]="voltar()"
    />

    <form class="cartao form-pac" novalidate (submit)="$event.preventDefault(); cadastrar()">
      <div class="form-pac-grade">
        <section class="form-pac-bloco" aria-labelledby="s-dados">
          <h2 id="s-dados" class="form-pac-titulo"><app-icone nome="usuario" /> Dados Pessoais</h2>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('nome')">
            <input type="text" placeholder="Nome completo" autocomplete="off" [value]="f().nome" (input)="digitar('nome', $event)" />
            @if (mostrarErro('nome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('nascimento')">
            <input type="date" [max]="hoje" aria-label="Data de nascimento" [value]="f().nascimento" (input)="digitar('nascimento', $event)" [class.campo-vazio]="!f().nascimento" />
            @if (!f().nascimento) { <span class="campo-falso">Data de nascimento</span> }
            @if (mostrarErro('nascimento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('email')">
            <input type="email" placeholder="E-mail" autocomplete="off" [value]="f().email" (input)="digitar('email', $event)" />
            @if (mostrarErro('email'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('cpf')">
            <input type="text" inputmode="numeric" placeholder="CPF" autocomplete="off" [value]="f().cpf" (input)="digitar('cpf', $event)" />
            @if (mostrarErro('cpf'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('telefone')">
            <input type="tel" inputmode="tel" placeholder="Telefone" autocomplete="off" [value]="f().telefone" (input)="digitar('telefone', $event)" />
            @if (mostrarErro('telefone'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <label class="campo-form">
            <input type="text" placeholder="Endereço" autocomplete="off" [value]="f().endereco" (input)="digitar('endereco', $event)" />
          </label>
        </section>

        <div class="form-pac-coluna">
          <section class="form-pac-bloco" aria-labelledby="s-prof">
            <h2 id="s-prof" class="form-pac-titulo">Dados Profissionais</h2>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cargo')">
              <input type="text" placeholder="Cargo" autocomplete="off" [value]="f().cargo" (input)="digitar('cargo', $event)" />
              @if (mostrarErro('cargo'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('admissao')">
              <input type="date" [max]="hoje" aria-label="Data de admissão" [value]="f().admissao" (input)="digitar('admissao', $event)" [class.campo-vazio]="!f().admissao" />
              @if (!f().admissao) { <span class="campo-falso">Data de admissão</span> }
              @if (mostrarErro('admissao'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <fieldset class="radios radios-status">
              <legend>Status da secretária</legend>
              <label class="radio"><input type="radio" name="status" [checked]="f().ativo" (change)="definir('ativo', true)" /><span class="radio-bolinha"></span> Ativo</label>
              <label class="radio"><input type="radio" name="status" [checked]="!f().ativo" (change)="definir('ativo', false)" /><span class="radio-bolinha"></span> Inativo</label>
            </fieldset>
          </section>

          <section class="form-pac-bloco" aria-labelledby="s-acesso">
            <h2 id="s-acesso" class="form-pac-titulo">Acesso ao sistema</h2>
            <div class="form-caixa">
              <label class="campo-form" [class.campo-form-erro]="mostrarErro('emailAcesso')">
                <input type="email" placeholder="E-mail de acesso" autocomplete="off" [value]="f().emailAcesso" (input)="digitar('emailAcesso', $event)" />
                @if (mostrarErro('emailAcesso'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
              </label>
              <div class="senha-linha">
                <label class="campo-form" [class.campo-form-erro]="mostrarErro('senha')">
                  <input type="text" [placeholder]="edicao() ? 'Nova senha (opcional)' : 'Senha Temporária'" autocomplete="off" [value]="f().senha" (input)="digitar('senha', $event)" />
                  @if (mostrarErro('senha'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
                </label>
                <button type="button" class="botao-escuro botao-com-icone" (click)="gerarSenha()"><app-icone nome="atualizar" /> Gerar senha</button>
              </div>
              <label class="check"><input type="checkbox" [checked]="f().boasVindas" (change)="definir('boasVindas', !f().boasVindas)" /><span class="caixa"></span> Enviar e-mail de boas-vindas com as instruções de acesso</label>
            </div>
          </section>
        </div>
      </div>

      <div class="form-pac-botoes">
        <button type="button" class="botao-claro" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="botao-escuro">{{ edicao() ? 'Salvar' : 'Cadastrar' }}</button>
      </div>
    </form>
  </div>

  <app-dialogo
    [aberto]="confirmando()" [titulo]="edicao() ? 'Salvar alterações?' : 'Confirmar Cadastro?'" textoConfirmar="Salvar"
    (cancelar)="confirmando.set(false)" (confirmar)="confirmar()"
  />
}
