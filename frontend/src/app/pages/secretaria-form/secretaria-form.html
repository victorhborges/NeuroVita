@if (edicao() && !existente()) {
  <div class="pg">
    <app-titulo-pagina titulo="Secretária não encontrada" subtitulo="Esse cadastro não existe ou foi removido." [voltarPara]="voltar()" />
  </div>
} @else {
  <div class="pg">
    <app-titulo-pagina
      [titulo]="edicao() ? 'Editar Cadastro' : 'Cadastrar Nova Secretária'"
      subtitulo="Preencha as informações para realizar o cadastro da secretária"
      [voltarPara]="voltar()"
    />

    <form class="cartao form-pac" novalidate (submit)="$event.preventDefault(); cadastrar()">
      <div class="form-pac-grade">
        <section class="form-pac-bloco" aria-labelledby="s-dados">
          <h2 id="s-dados" class="form-pac-titulo"><app-icone nome="usuario" /> Dados Pessoais</h2>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('nome')">
            <span class="campo-rotulo">Nome completo *</span>
            <input type="text" placeholder="Digite o nome completo" autocomplete="off" [value]="f().nome" (input)="digitar('nome', $event)" />
            @if (mostrarErro('nome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('nascimento')">
              <span class="campo-rotulo">Data de Nascimento*</span>
              <span class="campo-caixa">
                <input type="date" [max]="hoje" [value]="f().nascimento" (input)="digitar('nascimento', $event)" [class.campo-vazio]="!f().nascimento" />
                @if (!f().nascimento) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
              @if (mostrarErro('nascimento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cpf')">
              <span class="campo-rotulo">CPF*</span>
              <input type="text" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" [value]="f().cpf" (input)="digitar('cpf', $event)" />
              @if (mostrarErro('cpf'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('telefone')">
              <span class="campo-rotulo">Telefone</span>
              <input type="tel" inputmode="tel" placeholder="(00) 00000-0000" autocomplete="off" [value]="f().telefone" (input)="digitar('telefone', $event)" />
              @if (mostrarErro('telefone'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cep')">
              <span class="campo-rotulo">CEP*</span>
              <input type="text" inputmode="numeric" placeholder="00000-000" autocomplete="off" [value]="f().cep" (input)="digitar('cep', $event)" />
              @if (mostrarErro('cep'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <label class="campo-form">
            <span class="campo-rotulo">Endereço</span>
            <input type="text" placeholder="Digite o endereço completo" autocomplete="off" [value]="f().endereco" (input)="digitar('endereco', $event)" />
          </label>
          <div class="form-pac-endereco">
            <label class="campo-form">
              <span class="campo-rotulo">Cidade</span>
              <input type="text" placeholder="Brasília" autocomplete="off" [value]="f().cidade" (input)="digitar('cidade', $event)" />
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('numero')">
              <span class="campo-rotulo">Número*</span>
              <input type="text" inputmode="numeric" placeholder="Nº" autocomplete="off" [value]="f().numero" (input)="digitar('numero', $event)" />
              @if (mostrarErro('numero'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-complemento">
            <label class="campo-form">
              <span class="campo-rotulo">Complemento</span>
              <input type="text" placeholder="Digite o complemento" autocomplete="off" [value]="f().complemento" (input)="digitar('complemento', $event)" />
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('bairro')">
              <span class="campo-rotulo">Bairro*</span>
              <input type="text" placeholder="Digite o bairro" autocomplete="off" [value]="f().bairro" (input)="digitar('bairro', $event)" />
              @if (mostrarErro('bairro'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </div>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('encerramento')">
              <span class="campo-rotulo">Data de encerramento</span>
              <span class="campo-caixa">
                <input type="date" [value]="f().encerramento" (input)="digitar('encerramento', $event)" [class.campo-vazio]="!f().encerramento" />
                @if (!f().encerramento) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
              @if (mostrarErro('encerramento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form">
              <span class="campo-rotulo">Data de início</span>
              <span class="campo-caixa">
                <input type="date" [value]="f().admissao" (input)="digitar('admissao', $event)" [class.campo-vazio]="!f().admissao" />
                @if (!f().admissao) { <span class="campo-falso">DD/MM/AAAA</span> }
              </span>
            </label>
          </div>
        </section>

        <section class="form-pac-bloco" aria-labelledby="s-prof">
          <h2 id="s-prof" class="form-pac-titulo"><app-icone nome="usuario" /> Dados Profissionais</h2>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('cargo')">
            <span class="campo-rotulo">Área de Atuação</span>
            <input type="text" placeholder="Secretária" autocomplete="off" [value]="f().cargo" (input)="digitar('cargo', $event)" />
            @if (mostrarErro('cargo'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <div class="form-pac-duas">
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cbo')">
              <span class="campo-rotulo">CBO*</span>
              <input type="text" placeholder="Digite o CBO" autocomplete="off" [value]="f().cbo" (input)="digitar('cbo', $event)" />
              @if (mostrarErro('cbo'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form">
              <span class="campo-rotulo">Carga Horária</span>
              <input type="text" placeholder="Seg a Sex, 08h às 18h" autocomplete="off" [value]="f().cargaHoraria" (input)="digitar('cargaHoraria', $event)" />
            </label>
          </div>
          <label class="campo-form" [class.campo-form-erro]="mostrarErro('emailAcesso')">
            <span class="campo-rotulo">E-mail de acesso</span>
            <input type="email" placeholder="Digite o e-mail" autocomplete="off" [value]="f().emailAcesso" (input)="digitar('emailAcesso', $event)" />
            @if (mostrarErro('emailAcesso'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </label>
          <div class="campo-form" [class.campo-form-erro]="mostrarErro('senha')">
            <span class="campo-rotulo">Senha temporária</span>
            <div class="senha-linha">
              <input type="text" [placeholder]="edicao() ? 'Nova senha (opcional)' : ''" autocomplete="off" [value]="f().senha" (input)="digitar('senha', $event)" />
              <button type="button" class="botao-escuro botao-com-icone" (click)="gerarSenha()"><app-icone nome="atualizar" /> Gerar senha</button>
            </div>
            @if (mostrarErro('senha'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
          </div>
          <label class="check"><input type="checkbox" [checked]="f().boasVindas" (change)="definir('boasVindas', !f().boasVindas)" /><span class="caixa"></span> Enviar e-mail de boas-vindas com as instruções de acesso</label>
          <fieldset class="radios radios-status">
            <legend>Status</legend>
            <div class="radios-caixa">
              <label class="radio"><input type="radio" name="status" [checked]="f().ativo" (change)="definir('ativo', true)" /><span class="radio-bolinha"></span> Ativo</label>
              <label class="radio"><input type="radio" name="status" [checked]="!f().ativo" (change)="definir('ativo', false)" /><span class="radio-bolinha"></span> Inativo</label>
            </div>
          </fieldset>
        </section>
      </div>

      <div class="form-pac-botoes">
        <button type="button" class="botao-claro" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="botao-escuro">{{ edicao() ? 'Salvar' : 'Cadastrar' }}</button>
      </div>
    </form>
  </div>

  <app-dialogo
    [aberto]="confirmando()" [titulo]="edicao() ? 'Salvar alterações?' : 'Confirmar Cadastro?'" textoConfirmar="Salvar"
    (cancelar)="confirmando.set(false)" (confirmar)="confirmar()"
  />
}
